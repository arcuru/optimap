[package]
name = "optimap"
version = "0.1.0"
edition = "2024"
description = "OptiMap — multiple SIMD-accelerated hash map designs with different performance trade-offs"
license = "AGPL-3.0-or-later"

[dependencies]
foldhash = "0.1"
ahash = { version = "0.8", optional = true }
hashbrown = "0.15"

[features]
default = ["reduced-hash-asm"]
# reduced_hash implementation selection (mutually exclusive, last wins):
# - reduced-hash-asm (default): inline asm `cmp 0xFF; adc 0` — 2 instructions, 255 values (x86_64 only, falls back to pure Rust)
# - reduced-hash-128: `low | 1` — 1 instruction, 128 values (higher collision rate)
# - neither: pure Rust `low | (low == 0) as u8` — 3 instructions, 255 values
reduced-hash-asm = []
reduced-hash-128 = []
# Swap default hasher from foldhash to ahash. Experimental — see roadmap entry
# "Hashbrown wins at large N on lookup_hit". With this on, every map type's
# DefaultHashBuilder becomes ahash::RandomState instead of foldhash::fast::RandomState.
hasher-ahash = ["dep:ahash"]
# Disable _mm_prefetch calls inside the probe loops (matches hashbrown's
# zero-prefetch stance). Used to test whether the existing per-iteration
# prefetch is helping or hurting at large N. Wrappers become no-ops; all
# probe-loop call sites compile down to nothing.
no-probe-prefetch = []
# Wrap the Tomb (in_place_overflow) find_by_hash hit + match_empty branches in
# std::hint::likely(). Hashbrown does this; OptiMap doesn't. Requires nightly
# (#![feature(likely_unlikely)]).
tomb-branch-hints = []

[dev-dependencies]
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }
indexmap = "2"
rustc-hash = "2"
ahash = "0.8"
fnv = "1.0"
proptest = "1"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "construction"
harness = false

[[bench]]
name = "distributions"
harness = false

[[bench]]
name = "workloads"
harness = false

[[bench]]
name = "load_factor"
harness = false

[[bench]]
name = "btree"
harness = false

[[bench]]
name = "sets"
harness = false

[[bench]]
name = "sweep"
harness = false

[[bench]]
name = "sweep_btree"
harness = false

[[bench]]
